name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: JavaScript y fuentes · Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Auditar fuentes públicas
        run: python3 scripts/audit_publication.py
      - name: Reloj, cálculo y sintaxis de interfaz
        run: |
          node --version
          for file in Resources/web/*.js; do node --check "$file"; done
          node tests/calendar-clock.cjs
          node tests/grades.cjs
  verify:
    name: Swift y bundle ARM64 · macOS 26 Intel
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Herramientas existentes
        run: |
          uname -m
          xcrun swiftc --version
          python3 --version
          node --version
      - name: Auditar publicación
        run: python3 scripts/audit_publication.py
      - name: Almacenamiento, importaciones y planificación
        run: ./tests/run.sh
      - name: Compilar ARM64
        run: ./scripts/build.sh
      - name: Auditar ARM64 y comprobar arranque con datos aislados
        run: ./scripts/check-bundle.sh
