name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner_family:
        description: 'Ejecutor de pruebas; la aplicación se compila siempre para ARM64'
        type: choice
        default: intel
        options: [intel, arm64]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verificar · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runner_family == 'arm64' && '["macos-15","macos-26"]' || '["macos-15-intel","macos-26-intel"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Herramientas existentes
        run: |
          uname -m
          xcrun swiftc --version
          python3 --version
          node --version
      - name: Auditar publicación
        run: python3 scripts/audit_publication.py
      - name: Almacenamiento, importaciones y planificación
        run: ./tests/run.sh
      - name: Reloj, cálculo y sintaxis de interfaz
        run: ./tests/run-ui.sh
      - name: Compilar ARM64
        run: ./scripts/build.sh
      - name: Auditar ARM64 y comprobar arranque con datos aislados
        run: ./scripts/check-bundle.sh
